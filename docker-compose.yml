version: '3.8'
services:
  website:
    container_name: ${PROJECT_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - traefik-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT_NAME}.rule=Host(`${DOMAIN_NAME}`)'
      - 'traefik.http.routers.${PROJECT_NAME}.entrypoints=http'
      - 'traefik.http.routers.${PROJECT_NAME}-secure.rule=Host(`${DOMAIN_NAME}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-secure.entrypoints=https'
      - 'traefik.http.routers.${PROJECT_NAME}-secure.tls=false'
      - 'traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=3000'
    volumes:
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./prisma/db
        target: /app/prisma/db
      - type: bind
        source: ./uploads/
        target: /app/uploads/
networks:
  traefik-net:
    external: true
